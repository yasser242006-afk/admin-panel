<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D Hand Particles</title>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<!-- MediaPipe Hands (فقط، بدون camera_utils - هنتحكم في الكاميرا يدويًا لموثوقية أعلى) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#020207;
    font-family: Arial, sans-serif;
    overscroll-behavior:none;
  }

  #app { position:fixed; inset:0; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }

  /* كاميرا المستخدم */
  #webcam {
    position:fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    width:190px; height:142px;
    object-fit:cover;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.2);
    transform:scaleX(-1);
    opacity:.75;
    z-index:20;
    box-shadow:0 10px 40px rgba(0,0,0,.45), 0 0 30px rgba(0,255,255,.08);
    background:#000;
  }

  @media (max-width:600px){
    #webcam{ width:140px; height:105px; top:max(10px,env(safe-area-inset-top)); left:max(10px,env(safe-area-inset-left)); }
  }

  /* رسالة الكاميرا / التحميل */
  #status {
    position:fixed;
    left:50%; bottom: max(22px, env(safe-area-inset-bottom));
    transform:translateX(-50%);
    color:#eafcff;
    font-size:13px;
    background:rgba(10,10,20,.55);
    padding:8px 16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(6px);
    z-index:25;
    text-align:center;
    max-width:88vw;
    transition:opacity .4s ease;
  }
  #status.hidden{ opacity:0; pointer-events:none; }
  #status.error{ background:rgba(120,20,20,.75); border-color:rgba(255,120,120,.4); }

  /* لوحة الإشارات */
  #legend {
    position:fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index:20;
    background:rgba(10,10,20,.45);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:10px 12px;
    font-size:11px;
    color:#dfefff;
    line-height:1.9;
    backdrop-filter:blur(6px);
    max-width:150px;
  }
  #legend b{ color:#7cf1ff; }

  @media (max-width:600px){
    #legend{ font-size:9.5px; padding:8px 10px; line-height:1.7; max-width:110px; top:max(10px,env(safe-area-inset-top)); right:max(10px,env(safe-area-inset-right)); }
  }

  /* اسم الشكل الحالي */
  #shapeName {
    position:fixed;
    top: max(16px, env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%) translateY(-10px);
    z-index:20;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    letter-spacing:.5px;
    background:rgba(10,10,20,.4);
    padding:6px 18px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.15);
    opacity:0;
    transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  #shapeName.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

<body>

<div id="app"></div>
<video id="webcam" autoplay playsinline muted></video>

<div id="legend">
  <div><b>✋</b> كون عشوائي</div>
  <div><b>✊</b> قلب</div>
  <div><b>☝️</b> كوكب</div>
  <div><b>✌️</b> I LOVE YOU</div>
  <div><b>👍</b> فلسطين 🇵🇸</div>
</div>

<div id="shapeName"></div>
<div id="status">جارِ تشغيل الكاميرا...</div>

<script>
/* =========================================================
   إعداد أساسي
========================================================= */
const app = document.getElementById("app");
const video = document.getElementById("webcam");
const statusEl = document.getElementById("status");
const shapeNameEl = document.getElementById("shapeName");

let scene, camera, renderer;
let particleSystem, geometry, material;
let positions, targetPositions;
let particleColors, targetColors;
let clock = new THREE.Clock();

/* تقليل عدد الجسيمات على الموبايل لأداء أفضل */
const isMobile = Math.min(window.innerWidth, window.innerHeight) < 560;
const PARTICLE_COUNT = isMobile ? 9000 : 18000;

/* =========================================================
   الألوان
   ملاحظة: نستخدم Additive Blending، فاللون الأسود الخالص يختفي
   لأن جمعه على الخلفية السوداء = لا شيء. لذلك تم استبدال
   شريط العلم الأسود بلون فضي غامق يبقى مرئيًا مع الحفاظ على الطابع.
========================================================= */
const COLORS = {
  cyan:   new THREE.Color("#00ffff"),
  pink:   new THREE.Color("#ff2a8d"),
  purple: new THREE.Color("#9b5cff"),
  gold:   new THREE.Color("#ffd166"),
  white:  new THREE.Color("#ffffff"),
  green:  new THREE.Color("#0aa84a"),
  red:    new THREE.Color("#e4312b"),
  silver: new THREE.Color("#c9d3d8")
};

/* =========================================================
   تهيئة Three.js
========================================================= */
function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#020207");

  camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
  );
  camera.position.z = getResponsiveZ();

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  app.appendChild(renderer.domElement);

  createParticles();
  createStars();

  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", () => setTimeout(onResize, 250));
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", onResize);
  }

  animate();
}

/* حجم بعد الكاميرا يتغيّر حسب نسبة الشاشة، عشان الشكل يبان
   بحجم مناسب سواء موبايل أو تابلت أو لابتوب */
function getResponsiveZ() {
  const aspect = window.innerWidth / window.innerHeight;

  /* أكبر امتداد بين كل الأشكال هو حلقة الكوكب (~230)، بنحسب
     المسافة اللازمة رياضيًا عشان الشكل يدخل كامل عموديًا وأفقيًا
     مهما كانت نسبة الشاشة (موبايل عمودي أو لابتوب عريض) */
  const REQUIRED_EXTENT = 265; // نصف القطر + هامش أمان
  const halfFovRad = (55 / 2) * Math.PI / 180;
  const base = REQUIRED_EXTENT / Math.tan(halfFovRad);

  return Math.max(base, base / aspect);
}

/* =========================================================
   الجسيمات
========================================================= */
function createParticles() {
  geometry = new THREE.BufferGeometry();

  positions = new Float32Array(PARTICLE_COUNT * 3);
  targetPositions = new Float32Array(PARTICLE_COUNT * 3);
  particleColors = new Float32Array(PARTICLE_COUNT * 3);
  targetColors = new Float32Array(PARTICLE_COUNT * 3);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const i3 = i * 3;
    const radius = 500;

    positions[i3]     = (Math.random() - .5) * radius;
    positions[i3 + 1] = (Math.random() - .5) * radius;
    positions[i3 + 2] = (Math.random() - .5) * radius;

    targetPositions[i3]     = positions[i3];
    targetPositions[i3 + 1] = positions[i3 + 1];
    targetPositions[i3 + 2] = positions[i3 + 2];

    particleColors[i3] = 0; particleColors[i3+1] = 1; particleColors[i3+2] = 1;
    targetColors[i3]   = 0; targetColors[i3+1]   = 1; targetColors[i3+2]   = 1;
  }

  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.BufferAttribute(particleColors, 3));

  material = new THREE.PointsMaterial({
    size: isMobile ? 2.6 : 2.2,
    vertexColors: true,
    transparent: true,
    opacity: .92,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });

  particleSystem = new THREE.Points(geometry, material);
  scene.add(particleSystem);

  setShape(createHeart(), "قلب");
}

/* =========================================================
   الأشكال
========================================================= */
function createHeart() {
  const result = [];
  const scale = 10;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const t = Math.random() * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    const depth = (Math.random() - .5) * 65;
    const spread = Math.random() * 1.8;

    result.push({
      x: x*scale + (Math.random()-.5)*spread,
      y: y*scale + (Math.random()-.5)*spread,
      z: depth,
      color: COLORS.pink
    });
  }
  return result;
}

function createPlanet() {
  const result = [];
  const radius = 125;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const phi = Math.acos(2*Math.random()-1);
    const theta = Math.random()*Math.PI*2;
    const r = radius + (Math.random()-.5)*5;

    const x = r*Math.sin(phi)*Math.cos(theta);
    const y = r*Math.cos(phi);
    const z = r*Math.sin(phi)*Math.sin(theta);

    result.push({ x, y, z, color: i % 4 === 0 ? COLORS.gold : COLORS.cyan });
  }

  const ringStart = Math.floor(PARTICLE_COUNT * .75);
  for (let i = ringStart; i < PARTICLE_COUNT; i++) {
    const angle = Math.random()*Math.PI*2;
    const ringRadius = 175 + Math.random()*45;
    result[i] = {
      x: Math.cos(angle)*ringRadius,
      y: (Math.random()-.5)*10,
      z: Math.sin(angle)*ringRadius,
      color: COLORS.gold
    };
  }
  return result;
}

function createRandomUniverse() {
  const result = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const radius = 150 + Math.random()*300;
    const angle = Math.random()*Math.PI*2;
    result.push({
      x: Math.cos(angle)*radius,
      y: (Math.random()-.5)*500,
      z: Math.sin(angle)*radius,
      color: i % 3 === 0 ? COLORS.purple : COLORS.cyan
    });
  }
  return result;
}

function createText(text) {
  const canvas = document.createElement("canvas");
  canvas.width = 1400; canvas.height = 400;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  /* حجم الخط يتصاغر تلقائيًا لحد ما الكلمة كلها تدخل في عرض
     الكانفاس، عشان "I LOVE YOU" متجيش مقصوصة */
  const maxWidth = canvas.width * 0.9;
  let fontSize = 190;
  ctx.font = `900 ${fontSize}px Arial`;
  while (ctx.measureText(text).width > maxWidth && fontSize > 20) {
    fontSize -= 3;
    ctx.font = `900 ${fontSize}px Arial`;
  }

  ctx.fillText(text, canvas.width/2, canvas.height/2);

  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const points = [];
  const cx = canvas.width/2, cy = canvas.height/2;

  for (let y = 0; y < canvas.height; y += 4) {
    for (let x = 0; x < canvas.width; x += 4) {
      const index = (y*canvas.width + x) * 4;
      if (data[index+3] > 100) {
        points.push({
          x: (x-cx)*.47,
          y: -(y-cy)*.47,
          z: (Math.random()-.5)*25,
          color: COLORS.cyan
        });
      }
    }
  }

  if (!points.length) return createRandomUniverse();

  const result = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    /* توزيع متساوي على طول كل نقاط الصورة (مش أخذ أول جزء بس)
       عشان الشكل يبان كامل مهما كان عدد الجسيمات أقل من عدد النقط */
    const idx = Math.floor((i * points.length) / PARTICLE_COUNT) % points.length;
    const p = points[idx];
    result.push({
      x: p.x + (Math.random()-.5)*2,
      y: p.y + (Math.random()-.5)*2,
      z: p.z,
      color: p.color
    });
  }
  return result;
}

/* علم فلسطين: ثلاثة أشرطة (أسود مستبدل بفضي للرؤية + أبيض + أخضر)
   ومثلث أحمر جهة اليمين (بصريًا يمين الشاشة بسبب dir=rtl، لكن الإحداثيات
   ثابتة داخل النسيج نفسه فتبقى صحيحة بصريًا) */
function createPalestine() {
  const canvas = document.createElement("canvas");
  const w = 900, h = 450;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const bandH = h / 3;

  ctx.fillStyle = "#111111";
  ctx.fillRect(0, 0, w, bandH);

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, bandH, w, bandH);

  ctx.fillStyle = "#008000";
  ctx.fillRect(0, bandH*2, w, bandH);

  ctx.fillStyle = "#ff0000";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, h);
  ctx.lineTo(h*0.55, h/2);
  ctx.closePath();
  ctx.fill();

  const data = ctx.getImageData(0, 0, w, h).data;
  const points = [];

  for (let y = 0; y < h; y += 4) {
    for (let x = 0; x < w; x += 4) {
      const idx = (y*w + x) * 4;
      const r = data[idx], g = data[idx+1], b = data[idx+2];

      let color;
      if (r > 200 && g < 60 && b < 60) color = COLORS.red;
      else if (r > 200 && g > 200 && b > 200) color = COLORS.white;
      else if (g > 100 && r < 80 && b < 80) color = COLORS.green;
      else color = COLORS.silver;

      points.push({
        x: (x - w/2) * 0.42,
        y: -(y - h/2) * 0.42,
        z: (Math.random()-.5)*20,
        color
      });
    }
  }

  const result = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const idx = Math.floor((i * points.length) / PARTICLE_COUNT) % points.length;
    const p = points[idx];
    result.push({
      x: p.x + (Math.random()-.5)*1.5,
      y: p.y + (Math.random()-.5)*1.5,
      z: p.z,
      color: p.color
    });
  }
  return result;
}

/* =========================================================
   ضبط الهدف
========================================================= */
function setShape(points, label) {
  if (!points || !points.length) return;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = points[i % points.length];
    const i3 = i * 3;

    targetPositions[i3]     = p.x;
    targetPositions[i3 + 1] = p.y;
    targetPositions[i3 + 2] = p.z;

    targetColors[i3]     = p.color.r;
    targetColors[i3 + 1] = p.color.g;
    targetColors[i3 + 2] = p.color.b;
  }

  if (label) flashShapeName(label);
}

let shapeNameTimeout;
function flashShapeName(label) {
  shapeNameEl.textContent = label;
  shapeNameEl.classList.add("show");
  clearTimeout(shapeNameTimeout);
  shapeNameTimeout = setTimeout(() => shapeNameEl.classList.remove("show"), 1600);
}

/* =========================================================
   التعرّف على إشارات اليد
========================================================= */
function detectGesture(lm) {
  const indexUp  = lm[8].y  < lm[6].y;
  const middleUp = lm[12].y < lm[10].y;
  const ringUp   = lm[16].y < lm[14].y;
  const pinkyUp  = lm[20].y < lm[18].y;
  const thumbUp  = lm[4].y  < lm[3].y;

  if (indexUp && middleUp && ringUp && pinkyUp) return "OPEN";
  if (indexUp && middleUp && !ringUp && !pinkyUp) return "VICTORY";
  if (indexUp && !middleUp && !ringUp && !pinkyUp) return "ONE";
  if (!indexUp && !middleUp && !ringUp && !pinkyUp && !thumbUp) return "FIST";
  if (thumbUp && !indexUp && !middleUp && !ringUp && !pinkyUp) return "THUMB";

  return "UNKNOWN";
}

/* تثبيت الإشارة: لازم نفس الإشارة تتكرر لعدد فريمات متتالية
   قبل ما نغيّر الشكل، عشان نمنع الرجفة/التذبذب في الكشف */
let currentGesture = "";
let candidateGesture = "";
let candidateCount = 0;
const STABILITY_FRAMES = 6;

function changeGesture(gesture) {
  if (gesture === "UNKNOWN") { candidateGesture = ""; candidateCount = 0; return; }

  if (gesture === candidateGesture) {
    candidateCount++;
  } else {
    candidateGesture = gesture;
    candidateCount = 1;
  }

  if (candidateCount < STABILITY_FRAMES) return;
  if (gesture === currentGesture) return;

  currentGesture = gesture;

  if (gesture === "OPEN")     setShape(createRandomUniverse(), "كون عشوائي");
  else if (gesture === "FIST")    setShape(createHeart(), "قلب");
  else if (gesture === "ONE")     setShape(createPlanet(), "كوكب");
  else if (gesture === "VICTORY") setShape(createText("I LOVE YOU"), "I LOVE YOU");
  else if (gesture === "THUMB")   setShape(createPalestine(), "فلسطين 🇵🇸");
}

/* =========================================================
   الكاميرا + MediaPipe (تحكم يدوي بدل camera_utils)
========================================================= */
let hands;

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("error", !!isError);
  statusEl.classList.remove("hidden");
}

function hideStatusSoon() {
  setTimeout(() => statusEl.classList.add("hidden"), 1200);
}

async function initHandsAndCamera() {
  hands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: isMobile ? 0 : 1,
    minDetectionConfidence: .65,
    minTrackingConfidence: .65
  });

  hands.onResults(results => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
      const landmarks = results.multiHandLandmarks[0];
      const gesture = detectGesture(landmarks);
      changeGesture(gesture);
    } else {
      candidateGesture = "";
      candidateCount = 0;
    }
  });

  try {
    setStatus("جارِ طلب إذن الكاميرا...");

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    setStatus("جاهز! حرّك إيدك قدام الكاميرا 🖐️");
    hideStatusSoon();

    const frameLoop = async () => {
      if (video.readyState >= 2) {
        await hands.send({ image: video });
      }
      requestAnimationFrame(frameLoop);
    };
    frameLoop();

  } catch (err) {
    setStatus("تعذر الوصول للكاميرا، اسمح بالإذن من إعدادات المتصفح 🚫", true);
  }
}

/* =========================================================
   نجوم الخلفية
========================================================= */
function createStars() {
  const starGeometry = new THREE.BufferGeometry();
  const count = isMobile ? 1400 : 2500;
  const starPositions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    starPositions[i3]     = (Math.random()-.5)*1600;
    starPositions[i3 + 1] = (Math.random()-.5)*1000;
    starPositions[i3 + 2] = (Math.random()-.5)*1400;
  }

  starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));

  const starMaterial = new THREE.PointsMaterial({
    color: 0x555577, size: 1, transparent: true, opacity: .7
  });

  scene.add(new THREE.Points(starGeometry, starMaterial));
}

/* =========================================================
   حلقة الرسم
========================================================= */
function animate() {
  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();
  const pos = geometry.attributes.position;
  const color = geometry.attributes.color;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const i3 = i * 3;

    positions[i3]     += (targetPositions[i3]     - positions[i3])     * .075;
    positions[i3 + 1] += (targetPositions[i3 + 1] - positions[i3 + 1]) * .075;
    positions[i3 + 2] += (targetPositions[i3 + 2] - positions[i3 + 2]) * .075;

    particleColors[i3]     += (targetColors[i3]     - particleColors[i3])     * .08;
    particleColors[i3 + 1] += (targetColors[i3 + 1] - particleColors[i3 + 1]) * .08;
    particleColors[i3 + 2] += (targetColors[i3 + 2] - particleColors[i3 + 2]) * .08;
  }

  pos.needsUpdate = true;
  color.needsUpdate = true;

  particleSystem.rotation.y = Math.sin(time * .25) * .25;
  particleSystem.rotation.x = Math.sin(time * .18) * .08;

  const pulse = 1 + Math.sin(time * 1.5) * .015;
  particleSystem.scale.set(pulse, pulse, pulse);

  renderer.render(scene, camera);
}

/* =========================================================
   تغيير الحجم (تجاوب كامل: موبايل / تابلت / لابتوب)
========================================================= */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.position.z = getResponsiveZ();
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* =========================================================
   البداية
========================================================= */
initThree();
initHandsAndCamera();
</script>

</body>
</html>
