<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>3D Hand Particle</title>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020207;
  font-family: Arial, sans-serif;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* كاميرا المستخدم */

#webcam {
  position: fixed;

  top: 18px;
  left: 18px;

  width: 145px;
  height: 108px;

  object-fit: cover;

  border-radius: 16px;

  border: 1px solid rgba(255,255,255,.2);

  transform: scaleX(-1);

  opacity: .75;

  z-index: 20;

  box-shadow:
    0 10px 40px rgba(0,0,0,.45),
    0 0 30px rgba(0,255,255,.08);
}


/* الموبايل */

@media (max-width: 600px) {

  #webcam {

    width: 105px;
    height: 80px;

    top: 12px;
    left: 12px;

  }

}

</style>
</head>

<body>

<!-- مساحة الـ3D -->
<div id="app"></div>

<!-- الكاميرا -->
<video
  id="webcam"
  autoplay
  playsinline
  muted>
</video>


<script>

/* =========================================================
   BASIC SETUP
========================================================= */

const app =
  document.getElementById("app");

const video =
  document.getElementById("webcam");

let scene;
let camera;
let renderer;

let particleSystem;
let geometry;
let material;

let positions;
let targetPositions;

let particleColors;
let targetColors;

let clock =
  new THREE.Clock();

const PARTICLE_COUNT =
  18000;


/* =========================================================
   COLORS
========================================================= */

const COLORS = {

  cyan:
    new THREE.Color("#00ffff"),

  pink:
    new THREE.Color("#ff2a8d"),

  purple:
    new THREE.Color("#9b5cff"),

  gold:
    new THREE.Color("#ffd166"),

  white:
    new THREE.Color("#ffffff"),

  green:
    new THREE.Color("#38ff9c")

};


/* =========================================================
   INIT THREE.JS
========================================================= */

function initThree() {

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color("#020207");


  camera =
    new THREE.PerspectiveCamera(
      55,
      window.innerWidth /
      window.innerHeight,
      0.1,
      2000
    );


  camera.position.z =
    420;


  renderer =
    new THREE.WebGLRenderer({

      antialias: true,

      alpha: false

    });


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  renderer.outputColorSpace =
    THREE.SRGBColorSpace;


  app.appendChild(
    renderer.domElement
  );


  createParticles();

  createStars();


  window.addEventListener(
    "resize",
    onResize
  );


  animate();

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles() {

  geometry =
    new THREE.BufferGeometry();


  positions =
    new Float32Array(
      PARTICLE_COUNT * 3
    );


  targetPositions =
    new Float32Array(
      PARTICLE_COUNT * 3
    );


  particleColors =
    new Float32Array(
      PARTICLE_COUNT * 3
    );


  targetColors =
    new Float32Array(
      PARTICLE_COUNT * 3
    );


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const i3 =
      i * 3;


    const radius = 500;


    positions[i3] =
      (Math.random() - .5) *
      radius;


    positions[i3 + 1] =
      (Math.random() - .5) *
      radius;


    positions[i3 + 2] =
      (Math.random() - .5) *
      radius;


    targetPositions[i3] =
      positions[i3];


    targetPositions[i3 + 1] =
      positions[i3 + 1];


    targetPositions[i3 + 2] =
      positions[i3 + 2];


    particleColors[i3] =
      0;

    particleColors[i3 + 1] =
      1;

    particleColors[i3 + 2] =
      1;


    targetColors[i3] =
      0;

    targetColors[i3 + 1] =
      1;

    targetColors[i3 + 2] =
      1;

  }


  geometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
      positions,
      3
    )
  );


  geometry.setAttribute(
    "color",

    new THREE.BufferAttribute(
      particleColors,
      3
    )
  );


  material =
    new THREE.PointsMaterial({

      size: 2.2,

      vertexColors: true,

      transparent: true,

      opacity: .92,

      blending:
        THREE.AdditiveBlending,

      depthWrite: false,

      sizeAttenuation: true

    });


  particleSystem =
    new THREE.Points(
      geometry,
      material
    );


  scene.add(
    particleSystem
  );


  setShape(
    createHeart()
  );

}


/* =========================================================
   HEART 3D
========================================================= */

function createHeart() {

  const result = [];

  const scale =
    10;


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const t =
      Math.random() *
      Math.PI * 2;


    const x =
      16 *
      Math.pow(
        Math.sin(t),
        3
      );


    const y =
      13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t);


    const depth =
      (Math.random() - .5) *
      65;


    const spread =
      Math.random() * 1.8;


    result.push({

      x:
        x * scale +
        (Math.random() - .5) *
        spread,

      y:
        y * scale +
        (Math.random() - .5) *
        spread,

      z:
        depth,

      color:
        COLORS.pink

    });

  }


  return result;

}


/* =========================================================
   PLANET 3D
========================================================= */

function createPlanet() {

  const result = [];

  const radius = 125;


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const phi =
      Math.acos(
        2 * Math.random() - 1
      );


    const theta =
      Math.random() *
      Math.PI * 2;


    const r =
      radius +
      (Math.random() - .5) *
      5;


    const x =
      r *
      Math.sin(phi) *
      Math.cos(theta);


    const y =
      r *
      Math.cos(phi);


    const z =
      r *
      Math.sin(phi) *
      Math.sin(theta);


    result.push({

      x,
      y,
      z,

      color:
        i % 4 === 0
          ? COLORS.gold
          : COLORS.cyan

    });

  }


  /*
    حلقات الكوكب
  */

  const ringStart =
    Math.floor(
      PARTICLE_COUNT * .75
    );


  for (
    let i = ringStart;
    i < PARTICLE_COUNT;
    i++
  ) {

    const angle =
      Math.random() *
      Math.PI * 2;


    const ringRadius =
      175 +
      Math.random() * 45;


    result[i] = {

      x:
        Math.cos(angle) *
        ringRadius,

      y:
        (Math.random() - .5) *
        10,

      z:
        Math.sin(angle) *
        ringRadius,

      color:
        COLORS.gold

    };

  }


  return result;

}


/* =========================================================
   STAR
========================================================= */

function createStarShape() {

  const result = [];

  const outer = 160;

  const inner = 65;

  const arms = 5;


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const angle =
      Math.random() *
      Math.PI * 2;


    const sector =
      angle %
      (Math.PI * 2 / arms);


    const distance =
      sector <
      Math.PI / arms

        ? inner +
          Math.random() *
          (outer - inner)

        : inner *
          Math.random();


    result.push({

      x:
        Math.cos(angle) *
        distance,

      y:
        Math.sin(angle) *
        distance,

      z:
        (Math.random() - .5) *
        35,

      color:
        COLORS.gold

    });

  }


  return result;

}


/* =========================================================
   RANDOM UNIVERSE
========================================================= */

function createRandomUniverse() {

  const result = [];


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const radius =
      150 +
      Math.random() *
      300;


    const angle =
      Math.random() *
      Math.PI * 2;


    result.push({

      x:
        Math.cos(angle) *
        radius,

      y:
        (Math.random() - .5) *
        500,

      z:
        Math.sin(angle) *
        radius,

      color:
        i % 3 === 0
          ? COLORS.purple
          : COLORS.cyan

    });

  }


  return result;

}


/* =========================================================
   TEXT PARTICLES
========================================================= */

function createText(text) {

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    1000;

  canvas.height =
    350;


  const ctx =
    canvas.getContext("2d");


  ctx.fillStyle =
    "white";


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";


  ctx.font =
    "900 150px Arial";


  ctx.fillText(
    text,
    500,
    175
  );


  const data =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    ).data;


  const points = [];


  for (
    let y = 0;
    y < canvas.height;
    y += 4
  ) {

    for (
      let x = 0;
      x < canvas.width;
      x += 4
    ) {

      const index =
        (y *
          canvas.width +
          x) *
        4;


      if (
        data[index + 3] >
        100
      ) {

        points.push({

          x:
            (x - 500) *
            .65,

          y:
            -(y - 175) *
            .65,

          z:
            (Math.random() - .5) *
            25,

          color:
            COLORS.cyan

        });

      }

    }

  }


  const result = [];


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const p =
      points[
        i % points.length
      ];


    result.push({

      x:
        p.x +
        (Math.random() - .5) *
        2,

      y:
        p.y +
        (Math.random() - .5) *
        2,

      z:
        p.z,

      color:
        p.color

    });

  }


  return result;

}


/* =========================================================
   SET TARGET
========================================================= */

function setShape(points) {

  if (!points.length)
    return;


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const p =
      points[
        i % points.length
      ];


    const i3 =
      i * 3;


    targetPositions[i3] =
      p.x;


    targetPositions[i3 + 1] =
      p.y;


    targetPositions[i3 + 2] =
      p.z;


    targetColors[i3] =
      p.color.r;


    targetColors[i3 + 1] =
      p.color.g;


    targetColors[i3 + 2] =
      p.color.b;

  }

}


/* =========================================================
   HAND GESTURES
========================================================= */

let currentGesture = "";


function detectGesture(lm) {

  const indexUp =
    lm[8].y <
    lm[6].y;


  const middleUp =
    lm[12].y <
    lm[10].y;


  const ringUp =
    lm[16].y <
    lm[14].y;


  const pinkyUp =
    lm[20].y <
    lm[18].y;


  const thumbUp =
    lm[4].y <
    lm[3].y;


  if (
    indexUp &&
    middleUp &&
    ringUp &&
    pinkyUp
  ) {

    return "OPEN";

  }


  if (
    indexUp &&
    middleUp &&
    !ringUp &&
    !pinkyUp
  ) {

    return "VICTORY";

  }


  if (
    indexUp &&
    !middleUp &&
    !ringUp &&
    !pinkyUp
  ) {

    return "ONE";

  }


  if (
    !indexUp &&
    !middleUp &&
    !ringUp &&
    !pinkyUp
  ) {

    return "FIST";

  }


  if (
    thumbUp &&
    !indexUp &&
    !middleUp
  ) {

    return "THUMB";

  }


  return "UNKNOWN";

}


/* =========================================================
   GESTURE ACTION
========================================================= */

function changeGesture(gesture) {

  if (
    gesture ===
    currentGesture
  )
    return;


  currentGesture =
    gesture;


  if (
    gesture ===
    "OPEN"
  ) {

    setShape(
      createRandomUniverse()
    );

  }


  else if (
    gesture ===
    "FIST"
  ) {

    setShape(
      createHeart()
    );

  }


  else if (
    gesture ===
    "ONE"
  ) {

    setShape(
      createPlanet()
    );

  }


  else if (
    gesture ===
    "VICTORY"
  ) {

    setShape(
      createText(
        "I LOVE YOU"
      )
    );

  }


  else if (
    gesture ===
    "THUMB"
  ) {

    setShape(
      createStarShape()
    );

  }

}


/* =========================================================
   MEDIAPIPE
========================================================= */

function initHands() {

  const hands =
    new Hands({

      locateFile:
        file =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

    });


  hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence:
      .65,

    minTrackingConfidence:
      .65

  });


  hands.onResults(
    results => {

      if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length
      ) {

        const landmarks =
          results.multiHandLandmarks[0];


        const gesture =
          detectGesture(
            landmarks
          );


        changeGesture(
          gesture
        );

      }

    }
  );


  const camera =
    new Camera(
      video,
      {

        onFrame:
          async () => {

            await hands.send({
              image: video
            });

          },

        width: 640,

        height: 480

      }
    );


  camera.start();

}


/* =========================================================
   BACKGROUND STARS
========================================================= */

function createStars() {

  const starGeometry =
    new THREE.BufferGeometry();


  const starPositions =
    new Float32Array(
      2500 * 3
    );


  for (
    let i = 0;
    i < 2500;
    i++
  ) {

    const i3 =
      i * 3;


    starPositions[i3] =
      (Math.random() - .5) *
      1600;


    starPositions[i3 + 1] =
      (Math.random() - .5) *
      1000;


    starPositions[i3 + 2] =
      (Math.random() - .5) *
      1400;

  }


  starGeometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
      starPositions,
      3
    )
  );


  const starMaterial =
    new THREE.PointsMaterial({

      color: 0x555577,

      size: 1,

      transparent: true,

      opacity: .7

    });


  const stars =
    new THREE.Points(
      starGeometry,
      starMaterial
    );


  scene.add(stars);

}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

  requestAnimationFrame(
    animate
  );


  const time =
    clock.getElapsedTime();


  const pos =
    geometry.attributes.position;


  const color =
    geometry.attributes.color;


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const i3 =
      i * 3;


    positions[i3] +=
      (
        targetPositions[i3] -
        positions[i3]
      ) * .075;


    positions[i3 + 1] +=
      (
        targetPositions[i3 + 1] -
        positions[i3 + 1]
      ) * .075;


    positions[i3 + 2] +=
      (
        targetPositions[i3 + 2] -
        positions[i3 + 2]
      ) * .075;


    particleColors[i3] +=
      (
        targetColors[i3] -
        particleColors[i3]
      ) * .08;


    particleColors[i3 + 1] +=
      (
        targetColors[i3 + 1] -
        particleColors[i3 + 1]
      ) * .08;


    particleColors[i3 + 2] +=
      (
        targetColors[i3 + 2] -
        particleColors[i3 + 2]
      ) * .08;

  }


  pos.needsUpdate = true;

  color.needsUpdate = true;


  /*
    دوران 3D
  */

  particleSystem.rotation.y =
    Math.sin(
      time * .25
    ) * .25;


  particleSystem.rotation.x =
    Math.sin(
      time * .18
    ) * .08;


  /*
    نبض خفيف
  */

  const pulse =
    1 +
    Math.sin(
      time * 1.5
    ) * .015;


  particleSystem.scale.set(
    pulse,
    pulse,
    pulse
  );


  renderer.render(
    scene,
    camera
  );

}


/* =========================================================
   RESIZE
========================================================= */

function onResize() {

  camera.aspect =
    window.innerWidth /
    window.innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

}


/* =========================================================
   START DIRECTLY
========================================================= */

initThree();

initHands();

</script>

</body>
</html>
